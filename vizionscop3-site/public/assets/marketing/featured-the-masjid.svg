    <circle cx="800" cy="430" r="220" stroke-dasharray="6 14" opacity="0.5"/>
  </g>

  <g fill="#F5E8C9" opacity="0.85">
    <path d="M520 220 l4 -12 l4 12 l12 4 l-12 4 l-4 12 l-4 -12 l-12 -4 z"/>
    <path d="M1080 200 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 z"/>
    <circle cx="610" cy="290" r="2.5"/>
